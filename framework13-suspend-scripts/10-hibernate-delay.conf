# /etc/systemd/sleep.conf.d/10-hibernate-delay.conf
#
# suspend-then-hibernate: stay in s2idle for this long (instant resume between
# classes), then hibernate to disk (zero draw) for anything longer.
#
# 2h against a measured s2idle draw of 0.44 W (0.79 %/hour) costs ~1.6% of the
# battery before it goes to disk, whether you're away overnight or all weekend.
#
# HibernateOnACPower=no: while plugged in the battery isn't draining, so
# hibernating buys nothing and costs ~18 s of WiFi firmware reload on resume.
# On AC it just stays suspended.
#
# Leaving HibernateDelaySec unset would instead make systemd estimate from the
# battery discharge rate and hibernate only when the battery is nearly flat --
# more convenient, but it drains most of the pack first, which is exactly the
# "dead laptop in a bag" outcome this is meant to prevent.

[Sleep]
HibernateDelaySec=2h
HibernateOnACPower=no
