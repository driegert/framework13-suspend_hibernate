# /etc/systemd/logind.conf.d/10-lid-sleep.conf
#
# Use the "sleep" meta-action for the lid instead of a literal "suspend".
#
# "sleep" evaluates SleepOperation= candidates at the moment the lid closes, in
# a fixed order (suspend-then-hibernate -> hybrid-sleep -> suspend -> hibernate)
# and uses the first one the machine currently supports. So this gets
# suspend-then-hibernate while hibernation works, and degrades to a plain
# suspend by itself if it ever stops working -- rather than failing to sleep.
#
# HandleLidSwitchDocked is deliberately left at its default (ignore), so the
# machine stays awake with the lid shut when docked to an external display.

[Login]
HandleLidSwitch=sleep
HandleLidSwitchExternalPower=sleep
