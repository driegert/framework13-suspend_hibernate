# /etc/UPower/UPower.conf.d/10-hibernate-reserve.conf
#
# Raises the battery floor at which UPower fires CriticalPowerAction
# (HybridSleep -> writes a hibernation image), so there is enough charge left
# to actually finish writing it.
#
# The packaged default is PercentageAction=2.0. Writing a multi-gigabyte
# hibernation image starting from 2% is a very thin margin, and the failure is
# silent: swsusp writes the page data first and the header signature LAST, so a
# write that loses power partway leaves an image the kernel rejects on the next
# boot with "PM: Image not found (code -22)". The machine cold-boots and the
# session is simply gone, with no error shown to the user.
#
# This is the suspected cause of the session lost on 2026-08-17. The machine
# hibernated correctly at 20:29 after ~27 h on battery; the resume on 08-19
# failed with -22 despite an intact EFI HibernateLocation pointer and a
# resume_offset that had resumed successfully the previous night. At the time
# the image was ~26 GB written across 61 extents of a fragmented swapfile --
# a slow write with a correspondingly wide window to lose power in.
#
# Ordering constraint: PercentageLow > PercentageCritical > PercentageAction.
# PercentageLow is left at the packaged 20.0.

[UPower]
PercentageCritical=10.0
PercentageAction=7.0
